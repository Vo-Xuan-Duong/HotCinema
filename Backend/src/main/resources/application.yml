spring:
  application:
    name: cinema

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cinema}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:no-reply@hotcinema.local}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  booking:
    seat-hold-seconds: ${BOOKING_SEAT_HOLD_SECONDS:300}
    expiration-sweep-ms: ${BOOKING_EXPIRATION_SWEEP_MS:30000}
  ticket:
    scan-early-minutes: ${TICKET_SCAN_EARLY_MINUTES:60}
    scan-grace-minutes: ${TICKET_SCAN_GRACE_MINUTES:30}
  payment:
    momo:
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
  security:
    otp:
      ttl-seconds: ${OTP_TTL_SECONDS:300}
    jwt:
      secret: ${JWT_SECRET:hotcinema-dev-secret-key-change-before-production-2026}
      issuer: ${JWT_ISSUER:hotcinema}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
      refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
