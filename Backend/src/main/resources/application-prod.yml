spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:hotcinema}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
      refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
  payment:
    momo:
      api-base-url: ${MOMO_API_BASE_URL:https://test-payment.momo.vn}
      partner-code: ${MOMO_PARTNER_CODE:}
      partner-name: ${MOMO_PARTNER_NAME:HotCinema}
      store-id: ${MOMO_STORE_ID:HotCinema}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:}
      ipn-url: ${MOMO_IPN_URL:}
