spring.application.name=cinema

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cinema
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Tùy chọn ddl-auto: 'update' (tự động cập nhật bảng khi sửa code), 'validate' (chỉ kiểm tra khớp schema), 'none' (tắt)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (Tắt tạm thời nếu đang dùng ddl-auto=update để test)
# ===============================
spring.flyway.enabled=false

# ===============================
# REDIS CACHE
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
